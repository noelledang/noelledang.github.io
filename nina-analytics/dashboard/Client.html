<script>
(() => {
"use strict"; const $=id=>document.getElementById(id),state={questions:[],selected:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>v?new Date(v).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—";
const slug=v=>String(v||"").toLowerCase().replace(/[^a-z]+/g,"-"); let toastTimer;
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2500);}
function call(name,arg,ok,fail){const runner=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>fail?fail(e):toast(e.message||"Something went wrong."));if(arg===undefined)runner[name]();else runner[name](arg);}
function pill(t,v){return '<span class="pill '+t+'-'+slug(v)+'">'+esc(v||"Medium")+'</span>';}
function topicCounts(){const m={};state.questions.forEach(q=>{const k=q.category||"Uncategorized";m[k]=(m[k]||0)+q.occurrences});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,7);}
function renderMetrics(s){$("unanswered").textContent=s.unanswered;$("week").textContent=s.newThisWeek;$("recurring").textContent=s.recurring;$("resolved").textContent=s.resolved;$("open-count").textContent=s.open;$("groups").textContent=s.totalGroups;$("events").textContent=s.totalEvents;$("repeat-rate").textContent=s.repeatRate+"%";$("resolution-rate").textContent=s.resolutionRate+"%";}
function renderTopics(){const a=topicCounts(),max=Math.max(1,...a.map(x=>x[1]));$("topics").innerHTML=a.length?a.map(([n,c])=>'<div class="topic-row"><div class="topic-label"><b>'+esc(n)+'</b><span>'+c+'</span></div><div class="topic-track"><div class="topic-fill" style="width:'+(c/max*100)+'%"></div></div></div>').join(""):'<p class="empty">Topics will appear when questions arrive.</p>';}
function renderRecent(){const a=state.questions.slice(0,5);$("recent").innerHTML=a.length?a.map(q=>'<tr data-id="'+esc(q.id)+'"><td class="qcell">'+esc(q.question)+'</td><td>'+q.occurrences+'</td><td>'+pill("p",q.priority)+'</td><td>'+pill("s",q.status)+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">No unanswered questions have been logged yet.</td></tr>';bindRows("recent");}
function renderInbox(){const term=$("search").value.toLowerCase().trim(),st=$("filter-status").value,pr=$("filter-priority").value,a=state.questions.filter(q=>(!term||[q.question,q.category,q.notes].join(" ").toLowerCase().includes(term))&&(!st||q.status===st)&&(!pr||q.priority===pr));$("result-count").textContent=a.length+" question"+(a.length===1?"":"s");$("no-questions").hidden=state.questions.length!==0;$("rows").innerHTML=a.length?a.map(q=>'<tr data-id="'+esc(q.id)+'"><td><div class="qcell">'+esc(q.question)+'</div><small style="color:#a0a5af">'+esc(q.category)+'</small></td><td>'+date(q.first_seen)+'</td><td>'+date(q.last_seen)+'</td><td>'+q.occurrences+'</td><td>'+pill("p",q.priority)+'</td><td>'+pill("s",q.status)+'</td><td><button class="link">↗</button></td></tr>').join(""):'<tr><td colspan="7" class="empty">No questions match these filters.</td></tr>';bindRows("rows");}
function bindRows(id){$(id).querySelectorAll("[data-id]").forEach(r=>r.onclick=()=>openQuestion(r.dataset.id));}
function renderTrends(){const a=topicCounts(),max=Math.max(1,...a.map(x=>x[1]));$("trend-bars").innerHTML=a.length?a.map(([n,c])=>'<div><div class="bar-label"><b>'+esc(n)+'</b><span>'+c+' events</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(c/max*100)+'%"></div></div></div>').join(""):'<p class="empty">Trend data will appear after the first question.</p>';const repeats=state.questions.filter(q=>q.occurrences>1).sort((a,b)=>b.occurrences-a.occurrences),aging=state.questions.filter(q=>!["Resolved","Won't fix"].includes(q.status)&&Date.now()-new Date(q.first_seen).getTime()>604800000).length,notes=[];if(repeats.length)notes.push(["Recurring question",'"'+repeats[0].question+'" has appeared '+repeats[0].occurrences+" times."]);if(aging)notes.push(["Aging backlog",aging+" open question group(s) are older than 7 days."]);if(!notes.length&&state.questions.length)notes.push(["Keep watching","No strong repeat or aging patterns yet."]);$("insights").innerHTML=notes.length?notes.map(([h,p])=>'<div class="insight"><b>'+esc(h)+'</b><p>'+esc(p)+'</p></div>').join(""):'<p class="empty">Insights will appear as patterns emerge.</p>';}
function load(){call("getDashboardData",undefined,d=>{state.questions=d.questions||[];renderMetrics(d.summary);renderRecent();renderTopics();renderInbox();renderTrends();$("connection-title").textContent="Connected";$("connection-detail").textContent="Google Sheets · private access";$("connection-dot").classList.remove("offline");},e=>{$("connection-title").textContent="Setup needed";$("connection-detail").textContent=e.message||"Unable to load data";$("connection-dot").classList.add("offline");toast(e.message||"Unable to load dashboard.");});}
function openQuestion(id){const q=state.questions.find(x=>String(x.id)===String(id));if(!q)return;state.selected=q;$("d-category").textContent=q.category;$("d-question").textContent=q.question;$("d-occurrences").textContent=q.occurrences;$("d-first").textContent=date(q.first_seen);$("d-last").textContent=date(q.last_seen);$("category").value=q.category;$("priority").value=q.priority;$("status").value=q.status;$("notes").value=q.notes;$("question-events").innerHTML='<p class="empty">Loading…</p>';$("drawer").classList.add("open");$("backdrop").classList.add("open");call("getQuestionEvents",id,a=>{$("question-events").innerHTML=a.length?a.map(e=>'<div class="event">'+esc(e.question)+'<small>'+date(e.created_at)+'</small></div>').join(""):'<p class="empty">No examples found.</p>';});}
function closeDrawer(){$("drawer").classList.remove("open");$("backdrop").classList.remove("open");state.selected=null;}
function save(){if(!state.selected)return;const p={id:state.selected.id,category:$("category").value.trim()||"Uncategorized",priority:$("priority").value,status:$("status").value,notes:$("notes").value.trim()};call("updateQuestion",p,()=>{closeDrawer();toast("Question updated");load();});}
function exportCsv(){const rows=[["Question","Category","Occurrences","Priority","Status","First seen","Last seen","Notes"],...state.questions.map(q=>[q.question,q.category,q.occurrences,q.priority,q.status,q.first_seen,q.last_seen,q.notes])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=url;a.download="nina-unanswered-questions.csv";a.click();URL.revokeObjectURL(url);}
function view(n){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("active",e.id==="view-"+n));document.querySelectorAll(".nav").forEach(e=>e.classList.toggle("active",e.dataset.view===n));$("crumb").textContent=n==="questions"?"Question inbox":n[0].toUpperCase()+n.slice(1);}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>view(b.dataset.go));$("refresh").onclick=load;$("export").onclick=exportCsv;$("export-inbox").onclick=exportCsv;["search","filter-status","filter-priority"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",renderInbox));$("close-drawer").onclick=closeDrawer;$("cancel").onclick=closeDrawer;$("backdrop").onclick=closeDrawer;$("save").onclick=save;load();
})();
</script>
