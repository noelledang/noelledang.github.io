<script>
(() => {
"use strict";
const $=id=>document.getElementById(id),state={questions:[],enhancements:[],archived:[],selectedIds:new Set(),selected:null,selectedType:"question"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>v?new Date(v).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"—";
const slug=v=>String(v||"").toLowerCase().replace(/[^a-z]+/g,"-");let toastTimer;
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600);}
function call(name,arg,ok,fail){const runner=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>fail?fail(e):toast(e.message||"Something went wrong."));if(arg===undefined)runner[name]();else runner[name](arg);}
function pill(t,v){return '<span class="pill '+t+'-'+slug(v)+'">'+esc(v||"Medium")+'</span>';}
function topicCounts(){const m={};state.questions.concat(state.archived.filter(q=>q.type!=="enhancement")).forEach(q=>{const k=q.category||"Uncategorized";m[k]=(m[k]||0)+q.occurrences});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,7);}
function renderMetrics(s){$("unanswered").textContent=s.unanswered;$("week").textContent=s.newThisWeek;$("recurring").textContent=s.recurring;$("resolved").textContent=s.resolved;$("open-count").textContent=s.open;$("groups").textContent=s.totalGroups;$("events").textContent=s.totalEvents;$("repeat-rate").textContent=s.repeatRate+"%";$("resolution-rate").textContent=s.resolutionRate+"%";$("archive-count").textContent=s.archived;$("enhancement-count").textContent=s.enhancements;}
function renderTopics(){const a=topicCounts(),max=Math.max(1,...a.map(x=>x[1]));$("topics").innerHTML=a.length?a.map(([n,c])=>'<div class="topic-row"><div class="topic-label"><b>'+esc(n)+'</b><span>'+c+'</span></div><div class="topic-track"><div class="topic-fill" style="width:'+(c/max*100)+'%"></div></div></div>').join(""):'<p class="empty">Topics will appear when questions arrive.</p>';}
function renderRecent(){const a=state.questions.slice(0,5);$("recent").innerHTML=a.length?a.map(q=>'<tr data-id="'+esc(q.id)+'"><td class="qcell">'+esc(q.question)+'</td><td>'+q.occurrences+'</td><td>'+pill("p",q.priority)+'</td><td>'+pill("s",q.status)+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">No active question tickets.</td></tr>';bindRows("recent");}
function renderSelection(){const n=state.selectedIds.size;$("selected-count").textContent=n;$("create-enhancement").disabled=!n;}
function renderInbox(){const term=$("search").value.toLowerCase().trim(),st=$("filter-status").value,pr=$("filter-priority").value,a=state.questions.filter(q=>(!term||[q.question,q.category,q.notes].join(" ").toLowerCase().includes(term))&&(!st||q.status===st)&&(!pr||q.priority===pr));$("result-count").textContent=a.length+" active ticket"+(a.length===1?"":"s");$("no-questions").hidden=state.questions.length!==0;$("rows").innerHTML=a.length?a.map(q=>'<tr data-id="'+esc(q.id)+'"><td><input type="checkbox" class="ticket-check" data-check="'+esc(q.id)+'" '+(state.selectedIds.has(q.id)?"checked":"")+' aria-label="Select ticket"></td><td><div class="qcell">'+esc(q.question)+'</div><small style="color:#a0a5af">'+esc(q.category)+'</small></td><td>'+date(q.first_seen)+'</td><td>'+date(q.last_seen)+'</td><td>'+q.occurrences+'</td><td>'+pill("p",q.priority)+'</td><td>'+pill("s",q.status)+'</td><td><button class="link">↗</button></td></tr>').join(""):'<tr><td colspan="8" class="empty">No tickets match these filters.</td></tr>';bindRows("rows");$("rows").querySelectorAll("[data-check]").forEach(c=>c.onclick=e=>{e.stopPropagation();c.checked?state.selectedIds.add(c.dataset.check):state.selectedIds.delete(c.dataset.check);renderSelection();});$("select-all").checked=a.length>0&&a.every(q=>state.selectedIds.has(q.id));$("select-all").indeterminate=a.some(q=>state.selectedIds.has(q.id))&&!$("select-all").checked;renderSelection();}
function bindRows(id){$(id).querySelectorAll("tr[data-id]").forEach(r=>r.onclick=e=>{if(e.target.closest("input"))return;openQuestion(r.dataset.id);});}
function renderEnhancements(){$("enhancement-rows").innerHTML=state.enhancements.length?state.enhancements.map(t=>'<tr data-enhancement="'+esc(t.id)+'"><td><div class="qcell">'+esc(t.question)+'</div><small style="color:#a0a5af">'+esc(t.category)+'</small></td><td>'+Number(t.linkedCount||0)+'</td><td>'+pill("p",t.priority)+'</td><td>'+pill("s",t.status)+'</td><td>'+date(t.created_at)+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">No enhancement tickets created yet.</td></tr>';$("no-enhancements").hidden=state.enhancements.length!==0;$("enhancement-rows").querySelectorAll("[data-enhancement]").forEach(r=>r.onclick=()=>openEnhancement(r.dataset.enhancement));}
function renderArchive(){$("archive-rows").innerHTML=state.archived.length?state.archived.map(t=>'<tr data-archive="'+esc(t.id)+'"><td><div class="qcell">'+esc(t.question)+'</div><small style="color:#a0a5af">'+esc(t.category)+'</small></td><td>'+ (t.type==="enhancement"?"Enhancement":"Question")+'</td><td>'+pill("p",t.priority)+'</td><td>'+pill("s",t.status)+'</td><td>'+date(t.last_seen||t.created_at)+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">Nothing archived yet.</td></tr>';$("no-archive").hidden=true;$("archive-rows").querySelectorAll("[data-archive]").forEach(r=>r.onclick=()=>{const t=state.archived.find(x=>x.id===r.dataset.archive);if(t&&t.type==="enhancement")openEnhancement(t.id);else openQuestion(r.dataset.archive);});}
function renderTrends(){const a=topicCounts(),max=Math.max(1,...a.map(x=>x[1]));$("trend-bars").innerHTML=a.length?a.map(([n,c])=>'<div><div class="bar-label"><b>'+esc(n)+'</b><span>'+c+' events</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(c/max*100)+'%"></div></div></div>').join(""):'<p class="empty">Trend data will appear after the first question.</p>';const repeats=state.questions.concat(state.archived.filter(q=>q.type!=="enhancement")).filter(q=>q.occurrences>1).sort((a,b)=>b.occurrences-a.occurrences),aging=state.questions.filter(q=>Date.now()-new Date(q.first_seen).getTime()>604800000).length,notes=[];if(repeats.length)notes.push(["Recurring question",'"'+repeats[0].question+'" has appeared '+repeats[0].occurrences+" times."]);if(aging)notes.push(["Aging backlog",aging+" active question group(s) are older than 7 days."]);if(!notes.length&&state.questions.length)notes.push(["Keep watching","No strong repeat or aging patterns yet."]);$("insights").innerHTML=notes.length?notes.map(([h,p])=>'<div class="insight"><b>'+esc(h)+'</b><p>'+esc(p)+'</p></div>').join(""):'<p class="empty">Insights will appear as patterns emerge.</p>';}
function load(){call("getDashboardData",undefined,d=>{state.questions=d.questions||[];state.enhancements=d.enhancements||[];state.archived=d.archived||[];renderMetrics(d.summary);renderRecent();renderTopics();renderInbox();renderEnhancements();renderArchive();renderTrends();const deepLink=new URLSearchParams(window.location.search).get("enhancement");if(deepLink)openEnhancement(deepLink);$("connection-title").textContent="Connected";$("connection-detail").textContent="Google Sheets · private access";$("connection-dot").classList.remove("offline");},e=>{$("connection-title").textContent="Setup needed";$("connection-detail").textContent=e.message||"Unable to load data";$("connection-dot").classList.add("offline");toast(e.message||"Unable to load dashboard.");});}
function setEnhancementUrl(id){const u=new URL(window.location.href);if(id)u.searchParams.set("enhancement",id);else u.searchParams.delete("enhancement");history.replaceState({},"",u.toString());}\nfunction copyEnhancementUrl(){if(!state.selected||state.selectedType!=="enhancement")return;const u=new URL(window.location.href);u.searchParams.set("enhancement",state.selected.id);const value=u.toString();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>toast("Enhancement link copied")).catch(()=>fallbackCopy(value));}else fallbackCopy(value);}\nfunction fallbackCopy(value){const el=document.createElement("textarea");el.value=value;el.style.position="fixed";el.style.opacity="0";document.body.appendChild(el);el.select();try{document.execCommand("copy");toast("Enhancement link copied");}catch(e){toast("Copy unavailable — copy the URL from your address bar.");}el.remove();}\nfunction showDrawer(){ $("drawer").classList.add("open");$("backdrop").classList.add("open");}
function closeDrawer(){$("drawer").classList.remove("open");$("backdrop").classList.remove("open");if(state.selectedType==="enhancement")setEnhancementUrl(null);state.selected=null;}
function openQuestion(id){const q=state.questions.concat(state.archived).find(x=>String(x.id)===String(id));if(!q)return;const share=$("copy-enhancement-link");if(share)share.hidden=true;state.selected=q;state.selectedType="question";$("d-category").textContent=q.category;$("d-question").textContent=q.question;$("d-occurrences").textContent=q.occurrences;$("d-first").textContent=date(q.first_seen);$("d-last").textContent=date(q.last_seen);$("category").value=q.category;$("priority").value=q.priority;$("status").value=q.status;$("notes").value=q.notes;const parent=state.enhancements.concat(state.archived.filter(e=>e.type==="enhancement")).find(e=>String(e.id)===String(q.parent_id));$("link-controls").hidden=false;if(q.parent_id){$("link-controls").innerHTML='<label>LINKED PARENT ENHANCEMENT</label><div class="linked-ticket"><b>'+esc(parent?parent.question:"Enhancement "+q.parent_id)+'</b><small>'+(parent&&parent.archived?"Archived enhancement":"Active enhancement")+'</small><button class="link unlink-ticket" type="button" data-unlink="'+esc(q.id)+'">Unlink from enhancement ↗</button></div>';}else{$("link-controls").innerHTML='<label for="link-enhancement">LINK TO ENHANCEMENT</label><div class="link-control-row"><select id="link-enhancement"><option value="">Choose an enhancement…</option>'+state.enhancements.concat(state.archived.filter(e=>e.type==="enhancement")).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.question)+(e.archived?" · Archived":" · Active")+'</option>').join("")+'</select><button class="secondary" id="link-ticket" type="button">Link</button></div>';}$("linked-label").hidden=true;$("linked-tickets").innerHTML="";$("question-events").innerHTML='<p class="empty">Loading…</p>';$("archive-ticket").hidden=q.archived;$("complete-enhancement").hidden=true;$("save").hidden=q.archived;showDrawer();call("getQuestionEvents",id,a=>{$("question-events").innerHTML=a.length?a.map(e=>'<div class="event">'+esc(e.question)+'<small>'+date(e.created_at)+'</small></div>').join(""):'<p class="empty">No examples found.</p>';});}
function openEnhancement(id){const t=state.enhancements.concat(state.archived).find(x=>String(x.id)===String(id)&&x.type==="enhancement");if(!t)return;state.selected=t;setEnhancementUrl(t.id);state.selectedType="enhancement";$("d-category").textContent="Enhancement ticket";$("d-question").textContent=t.question;$("d-occurrences").textContent=t.linkedCount||0;$("d-first").textContent=date(t.created_at);$("d-last").textContent=date(t.last_seen);$("category").value=t.category;$("priority").value=t.priority;$("status").value=t.status;$("notes").value=t.notes;$("link-controls").hidden=true;$("linked-label").hidden=false;$("linked-tickets").innerHTML='<p class="empty">Loading linked tickets…</p>';$("question-events").innerHTML='<p class="empty">Enhancement groups the linked questions below.</p>';$("archive-ticket").hidden=true;$("complete-enhancement").hidden=!!t.archived;$("save").hidden=!!t.archived;let share=$("copy-enhancement-link");if(!share){share=document.createElement("button");share.id="copy-enhancement-link";share.className="secondary";share.type="button";share.textContent="Copy link";share.style.marginRight="auto";$("drawer").querySelector(".drawer-head").insertBefore(share,$("close-drawer"));share.onclick=copyEnhancementUrl;}share.hidden=false;showDrawer();call("getLinkedTickets",id,a=>{$("linked-tickets").innerHTML=a.length?a.map(q=>'<div class="linked-ticket"><b>'+esc(q.question)+'</b><small>'+q.occurrences+' occurrence(s) · archived under this enhancement</small><button class="link unlink-ticket" type="button" data-unlink="'+esc(q.id)+'">Unlink ↗</button></div>').join(""):'<p class="empty">No linked question tickets.</p>';});}
function save(){if(!state.selected)return;const p={id:state.selected.id,category:$("category").value.trim()||"Uncategorized",priority:$("priority").value,status:$("status").value,notes:$("notes").value.trim()};const fn=state.selectedType==="enhancement"?"updateEnhancement":"updateQuestion";call(fn,p,()=>{closeDrawer();toast("Ticket updated");load();});}
function archiveSelected(){if(!state.selected)return;const id=state.selected.id;call("archiveTicket",id,()=>{closeDrawer();toast("Ticket moved to archive");load();});}
function completeSelectedEnhancement(){if(!state.selected)return;const id=state.selected.id;call("completeEnhancement",id,()=>{closeDrawer();toast("Enhancement completed and archived");load();});}
function openEnhancementModal(){if(!state.selectedIds.size)return;$("enhancement-selected").textContent=state.selectedIds.size+" question ticket(s) will be linked and archived."; $("enhancement-name").value="";$("enhancement-description").value="";$("enhancement-modal").classList.add("open");$("enhancement-backdrop").classList.add("open");}
function closeEnhancementModal(){$("enhancement-modal").classList.remove("open");$("enhancement-backdrop").classList.remove("open");}
function createEnhancement(){const p={title:$("enhancement-name").value.trim(),description:$("enhancement-description").value.trim(),category:$("enhancement-category").value.trim(),priority:$("enhancement-priority").value,questionIds:Array.from(state.selectedIds)};if(!p.title){toast("Add an enhancement title first.");return;}call("createEnhancement",p,()=>{state.selectedIds.clear();closeEnhancementModal();view("enhancements");toast("Enhancement created; linked tickets archived");load();});}
function exportCsv(items,name){const rows=[["Ticket","Type","Category","Occurrences","Priority","Status","First seen","Last seen","Notes","Parent enhancement"],...items.map(q=>[q.question,q.type,q.category,q.occurrences,q.priority,q.status,q.first_seen,q.last_seen,q.notes,q.parent_id])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function view(n){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("active",e.id==="view-"+n));document.querySelectorAll(".nav").forEach(e=>e.classList.toggle("active",e.dataset.view===n));$("crumb").textContent=({questions:"Question inbox",enhancements:"Enhancements",archived:"Archive"})[n]||n[0].toUpperCase()+n.slice(1);}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>view(b.dataset.go));$("refresh").onclick=load;$("export").onclick=()=>exportCsv(state.questions.concat(state.enhancements),"nina-active-tickets.csv");$("export-inbox").onclick=()=>exportCsv(state.questions,"nina-question-inbox.csv");$("export-archive").onclick=()=>exportCsv(state.archived,"nina-archive.csv");["search","filter-status","filter-priority"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",renderInbox));$("select-all").onchange=e=>{const term=$("search").value.toLowerCase().trim(),st=$("filter-status").value,pr=$("filter-priority").value;state.questions.filter(q=>(!term||[q.question,q.category,q.notes].join(" ").toLowerCase().includes(term))&&(!st||q.status===st)&&(!pr||q.priority===pr)).forEach(q=>e.target.checked?state.selectedIds.add(q.id):state.selectedIds.delete(q.id));renderInbox();};$("create-enhancement").onclick=openEnhancementModal;$("close-enhancement").onclick=closeEnhancementModal;$("cancel-enhancement").onclick=closeEnhancementModal;$("enhancement-backdrop").onclick=closeEnhancementModal;$("save-enhancement").onclick=createEnhancement;$("close-drawer").onclick=closeDrawer;$("cancel").onclick=closeDrawer;$("backdrop").onclick=closeDrawer;window.addEventListener("popstate",()=>{const id=new URLSearchParams(window.location.search).get("enhancement");if(id)openEnhancement(id);else if(state.selectedType==="enhancement")closeDrawer();});$("save").onclick=save;$("archive-ticket").onclick=archiveSelected;$("complete-enhancement").onclick=completeSelectedEnhancement;function linkSelectedTicket(){if(!state.selected||!$("link-enhancement")||!$("link-enhancement").value){toast("Choose an enhancement first.");return;}const p={ticketId:state.selected.id,enhancementId:$("link-enhancement").value};call("linkTicket",p,()=>{closeDrawer();toast("Ticket linked to enhancement");load();});}function unlinkSelectedTicket(id){const parentId=state.selectedType==="enhancement"?state.selected.id:null;call("unlinkTicket",id,()=>{toast("Ticket unlinked and returned to Question Inbox");if(parentId)openEnhancement(parentId);else{closeDrawer();load();}});} $("link-controls").addEventListener("click",e=>{if(e.target.closest("#link-ticket"))linkSelectedTicket();const b=e.target.closest("[data-unlink]");if(b)unlinkSelectedTicket(b.dataset.unlink);});$("linked-tickets").addEventListener("click",e=>{const b=e.target.closest("[data-unlink]");if(!b)return;unlinkSelectedTicket(b.dataset.unlink);});load();
})();
</script>
